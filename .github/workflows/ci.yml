name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.part }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: check and build
            run: pnpm turbo run check build --concurrency=4
          - part: test
            run: pnpm turbo run test --filter=!@nostakes/room-server --concurrency=2
          - part: room-server test
            run: pnpm turbo run build --filter=@nostakes/room-server... && pnpm --filter @nostakes/room-server test
    env:
      TURBO_RUN_SUMMARY: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Use Node.js 24.22.3
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@12.20.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.part }}
        run: ${{ matrix.run }}
      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: turbo-runs-${{ strategy.job-index }}
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore

  smoke:
    name: smoke against local workerd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALCHEMY_TELEMETRY_DISABLED: "1"
      NO_COLOR: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Use Node.js 24.22.3
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@12.20.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build every package and the web app
        run: pnpm turbo run build
      - name: Start the production stack on local workerd as the preview stage
        working-directory: apps/room-server
        env:
          CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
        run: |
          pnpm exec alchemy dev --no-input --stage preview scripts/production.run.ts > "$RUNNER_TEMP/site.log" 2>&1 &
          for attempt in $(seq 1 120); do
            if grep -q "ready at http" "$RUNNER_TEMP/site.log"; then break; fi
            sleep 1
          done
          grep -oE "ready at http://localhost:[0-9]+" "$RUNNER_TEMP/site.log" | head -n 1 | sed 's/^ready at /SITE_URL=/' >> "$GITHUB_ENV"
      - name: Play one hand through the smoke check
        run: pnpm smoke "$SITE_URL" --origin=https://preview.nostakes.club
      - name: Show the local Worker's log
        if: failure()
        run: cat "$RUNNER_TEMP/site.log"
