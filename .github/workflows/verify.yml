name: Verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.target }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: verify-${{ matrix.target }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: engine
            run: pnpm turbo run verify --filter=@nostakes/engine
          - target: ledger
            run: pnpm turbo run verify --filter=@nostakes/ledger
          - target: room
            run: pnpm turbo run verify --filter=@nostakes/room
          - target: room-server
            run: pnpm turbo run build --filter=@nostakes/room-server... && SOAK_ROOMS=12 SOAK_HANDS=160 SOAK_CONCURRENCY=6 SOAK_BUDGET_MINUTES=20 pnpm --filter @nostakes/room-server verify
          - target: shuffle
            run: pnpm turbo run verify --filter=@nostakes/shuffle
          - target: web
            run: pnpm turbo run verify --filter=@nostakes/web
          - target: differential
            run: pnpm --filter @nostakes/engine differential --seed 20261110 --hands 100000
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Use Node.js 24.22.2
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@11.28.11 --activate
      - name: Install uv
        if: matrix.target == 'differential'
        uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Read the playwright-core version
        if: matrix.target == 'web'
        id: playwright
        run: echo "version=$(node -p "require('./apps/web/package.json').devDependencies['playwright-core']")" >> "$GITHUB_OUTPUT"
      - name: Restore the downloaded browser
        if: matrix.target == 'web'
        id: browser-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - name: Install a headless Chromium
        if: matrix.target == 'web'
        timeout-minutes: 25
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for attempt in 1 2 3; do
            if pnpm --filter @nostakes/web exec playwright-core install --with-deps --only-shell chromium; then
              exit 0
            fi
            echo "::warning::Installing the headless Chromium failed (attempt $attempt of 3)"
            sleep $((attempt * 30))
          done
          exit 1
      - name: Keep the downloaded browser
        if: matrix.target == 'web' && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Verify ${{ matrix.target }}
        run: ${{ matrix.run }}
      - name: Upload saved logs from a failed soak
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verify-${{ matrix.target }}-logs
          path: |
            /tmp/nostakes-soak-*
            ${{ runner.temp }}/nostakes-soak-*
          if-no-files-found: ignore

  full-soak:
    name: room-server full soak
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: verify-full-soak-${{ github.ref }}
      cancel-in-progress: false
    env:
      SOAK_CONCURRENCY: "3"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Use Node.js 24.22.2
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@11.28.11 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the room server and its packages
        run: pnpm turbo run build --filter=@nostakes/room-server...
      - name: Play 1,000 hands across 12 rooms
        run: pnpm --filter @nostakes/room-server exec vitest run --config vitest.verify.config.ts --silent=false scripts/soak.verify.ts
      - name: Upload saved logs from a failed soak
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verify-full-soak-logs
          path: |
            /tmp/nostakes-soak-*
            ${{ runner.temp }}/nostakes-soak-*
          if-no-files-found: ignore
